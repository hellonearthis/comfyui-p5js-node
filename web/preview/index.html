<!DOCTYPE HTML>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <script src="./p5.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #1a1a1a;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: monospace;
      color: #f87171;
    }
    canvas {
      display: block;
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }
    #p5-error {
      display: none;
      padding: 12px;
      font-size: 12px;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>
<body>
<div id="p5-error"></div>
<script type="text/javascript">
(function () {
  const errorBox = document.getElementById("p5-error");

  function showError(message) {
    errorBox.style.display = "block";
    errorBox.textContent = `Sketch Error: ${message}`;
  }

  function clearError() {
    errorBox.style.display = "none";
    errorBox.textContent = "";
  }

  window.addEventListener("error", (event) => {
    showError(event.message || "Unknown error");
  });

  window.__p5RunSketch = (srcCode) => {
    clearError();
    if (window.__p5Instance && typeof window.__p5Instance.remove === "function") {
      window.__p5Instance.remove();
      window.__p5Instance = null;
    }
    window.setup = undefined;
    window.draw = undefined;
    window.preload = undefined;

    try {
      window.eval(String(srcCode || ""));
      window.__p5Instance = new window.p5();
    } catch (err) {
      showError(err && err.message ? err.message : String(err));
      throw err;
    }
  };

  window.__p5StepFrame = () => {
    if (typeof window.noLoop === "function") {
      window.noLoop();
    }
    if (typeof window.redraw === "function") {
      window.redraw();
    }
  };
})();
</script>
</body>
</html>
